<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- WAD Events Stylized Petal / Celebration Blossom Brandmark -->
  <g transform="translate(60, 60)">
    <!-- Center delicate core -->
    <circle cx="0" cy="0" r="4.5" fill="#731823" />
    
    <!-- Top Petal -->
    <path d="M0,-8 C-14,-22 -18,-38 0,-52 C18,-38 14,-22 0,-8 Z" fill="#731823" fill-opacity="0.95" />
    
    <!-- Right Petal -->
    <path d="M8,0 C22,-14 38,-18 52,0 C38,18 22,14 8,0 Z" fill="#731823" fill-opacity="0.85" />
    
    <!-- Bottom Petal -->
    <path d="M0,8 C14,22 18,38 0,52 C-18,38 -14,22 0,8 Z" fill="#731823" fill-opacity="0.95" />
    
    <!-- Left Petal -->
    <path d="M-8,0 C-22,14 -38,18 -52,0 C-38,-18 -22,-14 -8,0 Z" fill="#731823" fill-opacity="0.85" />
    
    <!-- Diagonal Accents (Petal layers) -->
    <path d="M5,-5 C16,-20 30,-22 36,-14 C34,-4 20,4 5,-5 Z" fill="#B0C4DE" fill-opacity="0.75" />
    <path d="M5,5 C20,16 22,30 14,36 C4,34 -4,20 5,5 Z" fill="#B0C4DE" fill-opacity="0.75" />
    <path d="M-5,5 C-16,20 -30,22 -36,14 C-34,4 -20,-4 -5,5 Z" fill="#B0C4DE" fill-opacity="0.75" />
    <path d="M-5,-5 C-20,-16 -22,-30 -14,-36 C-4,-34 4,-20 -5,-5 Z" fill="#B0C4DE" fill-opacity="0.75" />
  </g>
</svg>
